spring:
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/workload_service
  activemq:
    broker-url: tcp://localhost:61616
    user: gym
    password: gym

eureka:
  client:
    service-url:
      defaultZone:  http://localhost:8761/eureka

jwt:
  secret: local-dev-secret-key-local-dev-secret-key

workload:
  messaging:
    queue:
      trainer-workload: trainer.workload.queue
      dead-letter: trainer.workload.queue.dlq
    redelivery:
      maximum-redeliveries: 3
      initial-delay-ms: 1000
      delay-ms: 2000
    consumer:
      concurrency: 2-3

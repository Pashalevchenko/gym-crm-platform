spring:
  application:
    name: workload-service
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}

server:
  port: 8082
  servlet:
    context-path: /workload-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:}
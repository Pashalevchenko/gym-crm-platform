spring:
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/workload_service_test
  jms:
    listener:
      auto-startup: false

jwt:
  secret: test-secret-key-test-secret-key-123456

eureka:
  client:
    enabled: false

workload:
  messaging:
    queue:
      trainer-workload: trainer.workload.queue
      dead-letter: ActiveMQ.DLQ
    redelivery:
      maximum-redeliveries: 3
      initial-delay-ms: 1000
      delay-ms: 2000
    consumer:
      concurrency: 2
services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - gym-network

  redis:
    image: redis:7.2-alpine
    container_name: gym-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - gym-network

  mongodb:
    image: mongo:7.0.12
    container_name: gym-mongodb
    ports:
      - "${MONGODB_PORT}:27017"
    networks:
      - gym-network

  activemq:
    image: apache/activemq-classic:5.18.6
    container_name: gym-activemq
    ports:
      - "${ACTIVEMQ_PORT}:61616"
      - "${ACTIVEMQ_WEB_PORT}:8161"
    networks:
      - gym-network

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    image: discovery-server:local
    container_name: discovery-server
    environment:
      SERVER_PORT: ${DISCOVERY_SERVER_PORT}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${DISCOVERY_HOST:-discovery-server}:8761/eureka/
    ports:
      - "${DISCOVERY_SERVER_PORT}:8761"
    networks:
      - gym-network

  workload-service:
    build:
      context: .
      dockerfile: workload-service/Dockerfile
    image: workload-service:local
    container_name: workload-service
    depends_on:
      - discovery-server
      - redis
      - mongodb
      - activemq
    environment:
      SERVER_PORT: ${WORKLOAD_SERVICE_PORT}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://${MONGODB_HOST:-mongodb}:27017/${MONGODB_DATABASE}
      ACTIVEMQ_BROKER_URL: tcp://${ACTIVEMQ_HOST:-activemq}:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      EUREKA_SERVER_URL: http://${DISCOVERY_HOST:-discovery-server}:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      TRAINER_WORKLOAD_QUEUE: ${TRAINER_WORKLOAD_QUEUE}
      TRAINER_WORKLOAD_DLQ: ${TRAINER_WORKLOAD_DLQ}
      WORKLOAD_MESSAGE_MAX_REDELIVERIES: ${WORKLOAD_MESSAGE_MAX_REDELIVERIES}
      WORKLOAD_MESSAGE_INITIAL_REDELIVERY_DELAY_MS: ${WORKLOAD_MESSAGE_INITIAL_REDELIVERY_DELAY_MS}
      WORKLOAD_MESSAGE_REDELIVERY_DELAY_MS: ${WORKLOAD_MESSAGE_REDELIVERY_DELAY_MS}
      WORKLOAD_MESSAGE_CONSUMER_CONCURRENCY: ${WORKLOAD_MESSAGE_CONSUMER_CONCURRENCY}
    ports:
      - "${WORKLOAD_SERVICE_PORT}:8082"
    networks:
      - gym-network

  gym-core-service:
    build:
      context: .
      dockerfile: gym-core-service/Dockerfile
    image: gym-core-service:local
    container_name: gym-core-service
    depends_on:
      - discovery-server
      - postgres
      - redis
      - activemq
      - workload-service
    environment:
      SERVER_PORT: ${GYM_CORE_SERVICE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      ACTIVEMQ_BROKER_URL: tcp://${ACTIVEMQ_HOST:-activemq}:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      EUREKA_SERVER_URL: http://${DISCOVERY_HOST:-discovery-server}:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      TRAINER_WORKLOAD_QUEUE: ${TRAINER_WORKLOAD_QUEUE}
      WORKLOAD_SERVICE_BASE_URL: http://${WORKLOAD_HOST:-workload-service}:8082/workload-service/api/v1
    ports:
      - "${GYM_CORE_SERVICE_PORT}:8081"
    networks:
      - gym-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    image: gateway-service:local
    container_name: gateway-service
    depends_on:
      - discovery-server
      - gym-core-service
      - workload-service
    environment:
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      SERVER_PORT: ${API_GATEWAY_PORT}
      EUREKA_SERVER_URL: http://${DISCOVERY_HOST:-discovery-server}:8761/eureka/
    ports:
      - "${API_GATEWAY_PORT}:8080"
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge
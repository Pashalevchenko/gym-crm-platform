spring:
  application:
    name: gym-core-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog-master.xml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:}
    user: ${ACTIVEMQ_USER:}
    password: ${ACTIVEMQ_PASSWORD:}

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

workload:
  service:
    base-url: ${WORKLOAD_SERVICE_URL:}
  messaging:
    queue:
      trainer-workload: ${TRAINER_WORKLOAD_QUEUE:}

server:
  port: 8081
  servlet:
    context-path: /gym-crm-application

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.boot.web.embedded.tomcat: INFO
    org.apache.catalina: INFO
    org.apache.coyote: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      workloadServiceCircuitBreaker:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
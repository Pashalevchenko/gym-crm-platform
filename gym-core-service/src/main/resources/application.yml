spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog-master.xml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  port: 8081
  servlet:
    context-path: /gym-crm-application

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.boot.web.embedded.tomcat: INFO
    org.apache.catalina: INFO
    org.apache.coyote: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
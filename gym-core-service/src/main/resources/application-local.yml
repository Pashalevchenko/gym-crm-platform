spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/gym-crm-application
    username: gym
    password: gym
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

app:
  cors:
    allowed-origins: http://localhost:3000

workload:
  service:
    base-url: http://localhost:8082/workload-service/api/v1
  messaging:
    queue:
      trainer-workload: trainer.workload.queue

jwt:
  secret: local-dev-secret-key-local-dev-secret-key
  expiration-ms: 3600000

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.gym.crm: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

logging:
  level:
    org.springframework.boot.web.embedded.tomcat: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN